# Infraestrutura local do projeto de ticketing, com os serviços como opcionais.
#
#   docker compose up -d                          -> só a infraestrutura (Kafka, bancos, Kafka UI).
#                                                    Os serviços rodam pela IDE, via localhost.
#   docker compose --profile apps up -d --build   -> infraestrutura + os dois serviços em containers.
#
# Dentro da rede do compose, os endereços são kafka:19092, orders-db:5432 e tickets-db:5432.
# Pela máquina, são localhost:9092, localhost:5433 e localhost:5434.

name: ticketing

services:
  # ---------------------------------------------------------------------------
  # Kafka em modo KRaft (sem Zookeeper), nó único
  #   - localhost:9092 -> para apps rodando na sua máquina (IDE)
  #   - kafka:19092    -> para containers dentro da rede do compose
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Cria os tópicos do projeto uma vez e encerra.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.created --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic tickets.reserved --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic tickets.reservation-failed --partitions 3 --replication-factor 1
        echo "Tópicos criados:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  # Interface web para ver tópicos, partições e mensagens. Acesse http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # ---------------------------------------------------------------------------
  # Um Postgres por serviço (database per service)
  # ---------------------------------------------------------------------------
  orders-db:
    image: postgres:16
    container_name: orders-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  tickets-db:
    image: postgres:16
    container_name: tickets-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ticketsdb
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    volumes:
      - tickets-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d ticketsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Serviços da aplicação. Só sobem com: docker compose --profile apps up -d --build
  # Não rode os mesmos serviços pela IDE ao mesmo tempo: as portas 8081 e 8082 colidem.
  # As variáveis SPRING_* sobrescrevem o que está no application.yaml.
  # ---------------------------------------------------------------------------
  order-service:
    profiles: ["apps"]
    build: ./order-service
    image: ticketing/order-service:dev
    container_name: order-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/ordersdb
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      orders-db:
        condition: service_healthy

  ticket-service:
    profiles: ["apps"]
    build: ./ticket-service
    image: ticketing/ticket-service:dev
    container_name: ticket-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tickets-db:5432/ticketsdb
      SPRING_DATASOURCE_USERNAME: tickets
      SPRING_DATASOURCE_PASSWORD: tickets
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      tickets-db:
        condition: service_healthy

volumes:
  kafka-data:
  orders-db-data:
  tickets-db-data:
