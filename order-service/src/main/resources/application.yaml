server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/ordersdb
    username: orders
    password: orders

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema vem do Flyway; o Hibernate só confere

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # O ErrorHandlingDeserializer evita que uma mensagem inválida trave o consumer
      # em loop: o erro é registrado e a mensagem é descartada.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # O producer não envia cabeçalho com o nome da classe, então o tipo é definido
        # em cada @KafkaListener (atributo properties), já que cada tópico tem um tipo.
        spring.json.use.type.headers: false

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Sem cabeçalho com o nome da classe Java: cada serviço tem seu próprio
        # record e o contrato é só o JSON.
        spring.json.add.type.headers: false